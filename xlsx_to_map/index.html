<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Importar archivo XLSX y generar mapa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header>
        <h1>Excel to Map</h1>
    </header>
    <main>
        <div id="controls">
            <input type="file" id="fileInput" />
            <p id="rowCount">Filas introducidas: 0</p>
            <label for="colorColumn">Seleccionar columna:</label>
            <select id="colorColumn"></select>
            <div id="legend"></div>
        </div>
        <div id="map"></div>
        <div id="info">
            <h2>Información del vector</h2>
            <table id="infoTable">
                <tbody></tbody>
            </table>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
